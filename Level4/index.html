<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Internship Website</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="#">My Website</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#posts">Posts</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="container">
      <h1>Welcome to My Website</h1>
    </div>
  </header>

  <main class="container">

    <section id="about" class="box">
      <h2>About Me</h2>
      <div class="row align-items-center g-4">
        <div class="col-md-5">
          <img src="https://picsum.photos/400/250" alt="Sample image" class="img-fluid">
        </div>
        <div class="col-md-7">
          <p>Hi, I am Suman Kumari a Front-End Development intern at Cognifyz.</p>
          <h3>My Skills</h3>
          <p>
            <span class="skill">HTML</span>
            <span class="skill">CSS</span>
            <span class="skill">JavaScript</span>
          </p>
          <button id="colorBtn" class="btn btn-primary">Change Background Color</button>
        </div>
      </div>
    </section>

    <section id="posts" class="box">
      <h2>Posts from API</h2>
      <div id="posts-list" class="row g-3"></div>
    </section>

    <section id="contact" class="box">
      <h2>Contact Form</h2>
      <form id="myForm" novalidate>
        <label for="name">Name</label>
        <input type="text" id="name" class="form-control">
        <span class="error" id="nameError"></span>

        <label for="email">Email</label>
        <input type="email" id="email" class="form-control">
        <span class="error" id="emailError"></span>

        <label for="password">Password</label>
        <input type="password" id="password" class="form-control">
        <span class="error" id="passError"></span>

        <button type="submit" class="btn btn-success mt-3">Submit</button>
        <p id="successMsg"></p>
      </form>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
